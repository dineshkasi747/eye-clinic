<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eye Clinic Loader</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    @keyframes blink {
      0%, 45%, 100% {
        transform: scaleY(0);
        opacity: 0;
      }
      48%, 52% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    @keyframes eyeFloat {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-6px) scale(1.03);
      }
    }

    @keyframes wingFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .blink {
      animation: blink 3s infinite;
    }

    .eyeFloat {
      animation: eyeFloat 2.5s ease-in-out infinite;
    }

    .wingFloat {
      animation: wingFloat 2s ease-in-out infinite;
    }
  </style>
</head>

<body class="bg-white flex items-center justify-center min-h-screen">
  <div class="relative flex flex-col items-center">

    <div class="absolute w-72 h-72 rounded-full bg-cyan-100 blur-3xl opacity-50 animate-pulse"></div>

    <div class="relative w-64 h-64 flex items-center justify-center">

      <div class="absolute left-2 w-24 h-40 rounded-full bg-gradient-to-b from-orange-400 via-red-500 to-purple-700 -rotate-[25deg] wingFloat"></div>

      <div class="absolute right-2 w-24 h-40 rounded-full bg-gradient-to-b from-orange-400 via-red-500 to-purple-700 rotate-[25deg] wingFloat"></div>

      <div class="absolute w-40 h-20 rounded-t-full border-t-[10px] border-blue-700 blink z-20"></div>

      <div class="relative w-36 h-36 rounded-full bg-gradient-to-br from-blue-300 to-cyan-500 shadow-2xl flex items-center justify-center overflow-hidden eyeFloat">
</html>
